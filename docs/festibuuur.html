<body class="festibuuur-page">
    <script>
        if (window.location.pathname.toLowerCase().endsWith('/festibuuur.html')) {

    <!-- Hero + navegación principal -->
    <section class="hero" id="hero">

        <section class="albumes" id="albumes">
